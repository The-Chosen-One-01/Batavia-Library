{% extends "base.html" %} {% block title %} Profile {% endblock %}

{% block nav %}
<div class="nav_bar">
    <a href="/find-book" class="nav_button">Find book</a>
    <details class="nav_button">
        <summary>Check Out Book</summary>
        <a href="/checkout" class="dropdown">Check Out Book</a>
        <a href="/return" class="dropdown">Return Book</a>
    </details>
    <details class="nav_button">
        <summary>{{ user }}</summary>
        <a href="/logout" class="dropdown">Log Out</a>
    </details>
    <a href="/about-us" class="nav_button">About Us</a>
</div>
{% endblock %}

{% block content %}
<div class="content">
    <h1 class="title">Profile</h1>
    <p style="text-align: center; font-size: 18px; margin-top: 40px;">Username: {{ user }}</p>
    <p style="text-align: center; font-size: 18px; color: #ffffff;">Books borrowed: {{ borrow_number }}</p>
    <div style="text-align: center; margin-top: 40px;">
        <a href="/" class="go_back">Back to Home</a>
    </div>
</div>
{% endblock %}
